<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10213f"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2348d0"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9620f"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8499"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#10213f" stroke-width="1.2"/></pattern>
</defs>
<style>
.t{font-family:"Golos Text, Segoe UI, sans-serif";font-size:16px;fill:#10213f}
.s{font-family:"Times New Roman, serif";font-style:italic;font-size:20px;fill:#10213f}
.sb{font-family:"Times New Roman, serif";font-style:italic;font-size:20px;fill:#2348d0}
.so{font-family:"Times New Roman, serif";font-style:italic;font-size:20px;fill:#c9620f}
.f{font-family:"Times New Roman, serif";font-size:19px;fill:#10213f}
.fo{font-family:"Times New Roman, serif";font-size:19px;fill:#c9620f}
</style>
<rect width="560" height="420" fill="#ffffff"/>
<circle cx="80.0" cy="215.0" r="55.0" stroke="#10213f" fill="#e8edfb" stroke-width="2.4"/>
<text x="80.0" y="222.0" class="s" text-anchor="middle">M</text>
<line x1="170.0" y1="110.0" x2="328.0" y2="110.0" stroke="#2348d0" stroke-width="4" marker-end="url(#ab)"/>
<text x="175.0" y="96.0" class="f" text-anchor="start">v₁ = √(gR) ≈ 7.9 km/s</text>
<line x1="170.0" y1="215.0" x2="394.0" y2="215.0" stroke="#c9620f" stroke-width="4" marker-end="url(#ao)"/>
<text x="175.0" y="201.0" class="fo" text-anchor="start">v₂ = √2·v₁ ≈ 11.2 km/s</text>
<line x1="170.0" y1="320.0" x2="504.0" y2="320.0" stroke="#10213f" stroke-width="4" marker-end="url(#ak)"/>
<text x="175.0" y="306.0" class="f" text-anchor="start">v₃ ≈ 16.7 km/s</text>
<line x1="170.0" y1="60.0" x2="170.0" y2="370.0" stroke="#7a8499" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
