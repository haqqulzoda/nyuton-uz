<text x="310" y="190" class="s" text-anchor="middle" style="font-size:21px;">p<tspan baseline-shift="sub" font-size="14">2</tspan></text>
<text x="280" y="395" class="s" text-anchor="middle" style="font-size:21px;fill:#10213f;">Δp = p<tspan baseline-shift="sub" font-size="14">2</tspan> − p<tspan baseline-shift="sub" font-size="14">1</tspan> = F<tspan font-style="normal">Δ</tspan>t</text>
<text x="140" y="70" class="s" text-anchor="middle" style="font-size:24px;fill:#c9620f;">dp/dt = F</text>
