<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
<defs>
<marker id="mB" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#2348d0"/></marker>
<marker id="mO" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#c9620f"/></marker>
<marker id="mK" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#10213f"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#10213f" stroke-width="1.4"/></pattern>
</defs>
<style>
.t{font-family:"Golos Text","Segoe UI",sans-serif;font-size:16px;fill:#10213f}
.s{font-family:"Times New Roman",serif;font-style:italic;font-size:21px;fill:#10213f}
.n{font-family:"Times New Roman",serif;font-style:normal;font-size:21px;fill:#10213f}
</style>
<rect x="0" y="0" width="560" height="420" fill="#ffffff"/>
<text x="70" y="60" class="s" text-anchor="middle" style="font-size:21px;">t</text>
<rect x="110" y="50" width="170" height="80" rx="6" fill="#e8eefc" stroke="#10213f" stroke-width="2" />
<text x="195" y="97" class="s" text-anchor="middle" style="font-size:21px;">m</text>
<line x1="290" y1="90" x2="370" y2="90" stroke="#2348d0" stroke-width="3" marker-end="url(#mB)"/>
<text x="330" y="78" class="s" text-anchor="middle" style="font-size:21px;fill:#2348d0;">v</text>
<text x="195" y="160" class="s" text-anchor="middle" style="font-size:21px;fill:#10213f;">mv</text>
<line x1="30" y1="190" x2="530" y2="190" stroke="#9aa6bd" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="70" y="260" class="s" text-anchor="middle" style="font-size:19px;">t + dt</text>
<rect x="110" y="225" width="170" height="80" rx="6" fill="#e8eefc" stroke="#10213f" stroke-width="2" />
<text x="195" y="272" class="s" text-anchor="middle" style="font-size:21px;">m − μdt</text>
<line x1="290" y1="265" x2="380" y2="265" stroke="#2348d0" stroke-width="3" marker-end="url(#mB)"/>
<text x="335" y="253" class="s" text-anchor="middle" style="font-size:19px;fill:#2348d0;">v + dv</text>
<circle cx="430" cy="300" r="14" fill="#fbeee2" stroke="#c9620f" stroke-width="2"/>
<text x="430" y="340" class="s" text-anchor="middle" style="font-size:19px;fill:#c9620f;">μdt</text>
<line x1="446" y1="300" x2="530" y2="300" stroke="#c9620f" stroke-width="3" marker-end="url(#mO)"/>
<text x="500" y="288" class="s" text-anchor="middle" style="font-size:19px;fill:#c9620f;">v + c</text>
<text x="280" y="395" class="s" text-anchor="middle" style="font-size:19px;">(m − μdt)(v + dv) + μdt(v + c) − mv = F<tspan font-style="normal">dt</tspan></text>
</svg>
