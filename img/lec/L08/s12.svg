<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
<defs>
<marker id="mB" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#2348d0"/></marker>
<marker id="mO" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#c9620f"/></marker>
<marker id="mK" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#10213f"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#10213f" stroke-width="1.4"/></pattern>
</defs>
<style>
.t{font-family:"Golos Text","Segoe UI",sans-serif;font-size:16px;fill:#10213f}
.s{font-family:"Times New Roman",serif;font-style:italic;font-size:21px;fill:#10213f}
.n{font-family:"Times New Roman",serif;font-style:normal;font-size:21px;fill:#10213f}
</style>
<rect x="0" y="0" width="560" height="420" fill="#ffffff"/>
<rect x="30" y="230" width="500" height="12" rx="0" fill="url(#hatch)" stroke="none" stroke-width="0" />
<line x1="30" y1="230" x2="530" y2="230" stroke="#10213f" stroke-width="2"/>
<rect x="70" y="180" width="60" height="50" rx="0" fill="#e8eefc" stroke="#10213f" stroke-width="2" />
<text x="100" y="212" class="s" text-anchor="middle" style="font-size:21px;">m</text>
<rect x="390" y="180" width="60" height="50" rx="0" fill="#e8eefc" stroke="#10213f" stroke-width="2" />
<text x="420" y="212" class="s" text-anchor="middle" style="font-size:21px;">m</text>
<line x1="130" y1="205" x2="190" y2="205" stroke="#c9620f" stroke-width="4" marker-end="url(#mO)"/>
<text x="160" y="194" class="s" text-anchor="middle" style="font-size:21px;fill:#c9620f;">F</text>
<line x1="450" y1="205" x2="510" y2="205" stroke="#c9620f" stroke-width="4" marker-end="url(#mO)"/>
<text x="480" y="194" class="s" text-anchor="middle" style="font-size:21px;fill:#c9620f;">F</text>
<line x1="80" y1="150" x2="140" y2="150" stroke="#2348d0" stroke-width="3" marker-end="url(#mB)"/>
<text x="110" y="138" class="s" text-anchor="middle" style="font-size:21px;fill:#2348d0;">v<tspan baseline-shift="sub" font-size="14">1</tspan></text>
<line x1="390" y1="150" x2="500" y2="150" stroke="#2348d0" stroke-width="3" marker-end="url(#mB)"/>
<text x="445" y="138" class="s" text-anchor="middle" style="font-size:21px;fill:#2348d0;">v<tspan baseline-shift="sub" font-size="14">2</tspan></text>
<text x="100" y="265" class="n" text-anchor="middle" style="font-size:21px;">1</text>
<text x="420" y="265" class="n" text-anchor="middle" style="font-size:21px;">2</text>
<line x1="250" y1="236" x2="250" y2="256" stroke="#10213f" stroke-width="1.5"/>
<line x1="280" y1="236" x2="280" y2="256" stroke="#10213f" stroke-width="1.5"/>
<text x="265" y="280" class="s" text-anchor="middle" style="font-size:19px;">ds</text>
<text x="280" y="335" class="s" text-anchor="middle" style="font-size:21px;">F ds = m (dv/dt) ds = mv dv</text>
<text x="280" y="380" class="s" text-anchor="middle" style="font-size:21px;fill:#c9620f;">ds/dt = v</text>
</svg>
